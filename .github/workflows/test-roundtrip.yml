name: test-roundtrip

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roundtrip:
    name: Round-trip / JDK ${{ matrix.java }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { java: '8', mode: debug, args: '' }
          - { java: '11', mode: debug, args: '' }
          - { java: '17', mode: debug, args: '' }
          - { java: '21', mode: debug, args: '' }
          - { java: '25', mode: debug, args: '' }
          - { java: '8', mode: no-debug, args: '--no-debug' }
          - { java: '17', mode: no-debug, args: '--no-debug' }
          - { java: '25', mode: no-debug, args: '--no-debug' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:roundtrip -- ${{ matrix.args }}
      - if: matrix.java == '8' && matrix.mode == 'debug'
        run: |
          node test/audit/java8-correctness.mjs --source=6 Anonymous Generic InnerConstruction Nested
          node test/audit/java8-correctness.mjs --source=7 Anonymous Generic InnerConstruction Nested
      - if: matrix.java == '17' && matrix.mode == 'debug'
        run: node test/audit/java8-correctness.mjs --source=8
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: roundtrip-${{ matrix.java }}-${{ matrix.mode }}
          path: |
            /tmp/jsd-e2e-*
            /tmp/jsd-java8-audit-*
          if-no-files-found: ignore
          retention-days: 7
