name: modern

on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modern:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            scope: '--max-release=21'
          - java: '25'
            scope: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node test/run-modern.mjs --require-all ${{ matrix.scope }}
      - run: node test/run-modern.mjs --require-all ${{ matrix.scope }} --no-debug
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: modern-${{ strategy.job-index }}
          path: /tmp/jsd-modern-e2e-*
          if-no-files-found: ignore
          retention-days: 7
