name: fuzz

on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node test/fuzz.mjs 2000 20260907 --force
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ strategy.job-index }}
          path: /tmp/jsd-fuzz-crashes
          if-no-files-found: ignore
          retention-days: 7
