name: test-fuzz

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz / 2,000 mutations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:fuzz -- --rounds=2000 --seed=20260907
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz
          path: /tmp/jsd-fuzz-*
          if-no-files-found: ignore
          retention-days: 7
